[package]
name = "e2eel"
description = "A Rust end-to-end encryption library for key management"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
license = "LGPL-3.0-or-later"
repository = "https://github.com/afesguerra/e2eel"


[dependencies]
aead = { version = "0.5.2", default-features = false, features = ["std"], optional = true }
aes-gcm = { version = "0.10.3", features = ["std"], optional = true }
crypto_secretbox = { version = "0.1.1", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
thiserror = "2.0.18"
zeroize = { version = "1.8.2", features = ["derive"] }

[features]
json = ["dep:serde", "dep:serde_json"]
aes256-gcm = ["dep:aead", "dep:aes-gcm"]
xsalsa20-poly1305 = ["dep:aead", "dep:crypto_secretbox"]
